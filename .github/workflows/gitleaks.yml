name: Gitleaks secret scan

# Run on every pull request that targets main.
on:
  pull_request:
    branches: [main]

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    # This name is what branch protection will list as the required check.
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 downloads the full git history. Gitleaks needs both the
      # PR's base and head commits locally to work out which commits are new.
      - name: Check out code (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Use the MIT-licensed Gitleaks CLI directly: no license key or token needed.
      # The download is checked against the release's published SHA-256 checksums
      # before it is run, so a tampered binary would stop the job.
      - name: Install Gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum --check
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      # Scan only the commits this pull request adds: everything reachable from
      # the PR head but not from the PR base. Every commit in the PR is checked,
      # so a secret added and then deleted within the PR is still caught.
      # Without --log-opts, Gitleaks runs "git log --all" and scans every branch.
      # --redact : hide secret values in the public Actions log
      # Any finding makes Gitleaks exit with code 1, which fails the check.
      - name: Run Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
